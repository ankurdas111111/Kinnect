<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- HEARTH faces (Stitch palette): warm paper by day, lamplit charcoal by night -->
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#292623" />
  <meta name="theme-color" content="#fff8f4" />
  <title>Kinnect</title>
  <meta name="description" content="Kinnect shows your family as a few pebbles on a quiet map and tells you, in one sentence, whether everyone's OK. No feeds. No pings. No dashboard." />
  <meta property="og:title" content="Kinnect — a quiet map for the people you love" />
  <meta property="og:description" content="Family location sharing without the noise: a few pebbles, one honest sentence, and a hold-to-send SOS for the one evening in a thousand." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kinnect" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Kinnect — a quiet map for the people you love" />
  <meta name="twitter:description" content="Family location sharing without the noise. No feeds. No pings. No dashboard." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Apply saved theme before first paint to prevent flash of wrong theme.
       VIGIL rebrand: only dark/light exist; legacy ids migrate to 'dark'
       (keep the LEGACY map in sync with lib/stores/theme.js). -->
  <script>
    (function() {
      try {
        var legacy = {vapor:1,aurora:1,midnight:1,'deep-ocean':1,bloom:1};
        var t = localStorage.getItem('theme');
        if (t && legacy[t]) {
          t = 'dark';
          try { localStorage.setItem('theme', t); } catch (e) {}
        }
        // HEARTH is light-first ("warm paper instead of dark glass"), so an
        // unset preference paints light. An explicit stored choice still wins,
        // and OS dark-mode users still get the night face.
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
        // Daypart tint pre-paint (buckets must match lib/daypart.js daypartFor)
        if (localStorage.getItem('daypart-enabled') !== '0') {
          var h = new Date().getHours();
          document.documentElement.setAttribute('data-daypart',
            h < 5 ? 'night' : h < 8 ? 'dawn' : h < 17 ? 'day' : h < 20 ? 'dusk' : 'night');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <!-- Preload the MapLibre CSP worker (454 kB) so the browser fetches it at HTML
       parse time rather than after maplibre-gl.js executes. -->
  <link rel="preload" href="/maplibre-gl-csp-worker.js" as="script" />
  <!-- Preload the local liberty style JSON so it is in the prefetch cache
       when MapLibre requests it during initialisation, cutting one serial RTT. -->
  <link rel="preload" href="/map-style.json" as="fetch" crossorigin />
  <!-- Fonts are self-hosted via Fontsource (imported in src/main.js) — no
       Google Fonts runtime dependency, works offline in the Capacitor shell.
       Work Sans 400-700 (everything) | Newsreader italic (verdict voice) -->
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
