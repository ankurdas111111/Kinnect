<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d9488" />
  <title>Kinnect</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <!-- Apply saved theme before first paint to prevent flash of wrong theme -->
  <script>
    (function() {
      try {
        var valid = {dark:1,light:1,'deep-ocean':1,aurora:1,midnight:1,vapor:1,bloom:1};
        var t = localStorage.getItem('theme');
        if (t && valid[t]) {
          document.documentElement.setAttribute('data-theme', t);
        } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="dns-prefetch" href="https://tiles.openfreemap.org" />
  <link rel="preconnect" href="https://tiles.openfreemap.org" crossorigin />
  <!-- Preload the MapLibre CSP worker (454 kB) so the browser fetches it at HTML
       parse time rather than after maplibre-gl.js executes. -->
  <link rel="preload" href="/maplibre-gl-csp-worker.js" as="script" />
  <!-- Preload the local liberty style JSON so it is in the prefetch cache
       when MapLibre requests it during initialisation, cutting one serial RTT. -->
  <link rel="preload" href="/map-style.json" as="fetch" crossorigin />
  <!-- Sora: geometric, distinctive display/heading font — uncommon, characterful -->
  <!-- Nunito: rounded, warm body font — friendly and family-appropriate          -->
  <!-- JetBrains Mono: monospace for coordinates, codes, metrics                 -->
  <!-- Non-blocking font load: preload as style, swap rel on load so fonts don't block first paint -->
  <!-- Weights trimmed to only those actually used (~50-80 kB saving): -->
  <!--   Sora 600;700;800 | Nunito 400;600;700 | JetBrains Mono 500  -->
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap" /></noscript>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
